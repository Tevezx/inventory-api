services:
  mysql:
    image: mysql:9.0.1
    container_name: mysql_inventory
    environment:
      MYSQL_ROOT_PASSWORD: ${ENV_ROOT_PASSWORD}
      MYSQL_USER: ${ENV_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - inventory-api:/var/lib/sql
volumes:
  inventory-api: